services:
  app:
    build: .
    image: app_route
    ports:
      - "5050:5050"
    depends_on:
      - db
    restart: on-failure

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: web_route
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: webRoutes
    ports:
      - "5433:5432"
    volumes:
      - ./internal/repositories/migrations:/docker-entrypoint-initdb.d